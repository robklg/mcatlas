repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright (strict)
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contracts)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (incl. read-only pipeline test)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
